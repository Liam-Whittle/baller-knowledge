<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baller Knowledge</title>
  <meta name="description" content="A party game where only your rarest answer counts.">
  <meta name="theme-color" content="#0a0612">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sparkles" aria-hidden="true"></div>
  <div id="app"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toasts" aria-live="polite"></div>

  <div id="sound" class="sound">
    <div id="sound-panel" class="sound-panel card" hidden>
      <label class="sound-row"><span>Music</span><input type="checkbox" id="music-on" class="switch"></label>
      <label class="sound-row sub"><span>Volume</span><input type="range" id="music-vol" min="0" max="100" step="1"></label>
      <div class="sound-sep"></div>
      <label class="sound-row"><span>Sound effects</span><input type="checkbox" id="sfx-on" class="switch"></label>
      <label class="sound-row sub"><span>Volume</span><input type="range" id="sfx-vol" min="0" max="100" step="1"></label>
      <div class="sound-sep"></div>
      <div class="sound-row"><span>AI judge <small id="ai-state" class="ai-state">off</small></span><button type="button" class="btn small" data-act="ai-setup">Set up</button></div>
    </div>
    <button id="sound-btn" class="sound-btn" type="button" aria-label="Music settings" aria-expanded="false" aria-controls="sound-panel">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <audio id="music" src="assets/music-1.mp3" preload="none"></audio>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/questions/nature-1.js"></script>
  <script src="js/questions/nature-2.js"></script>
  <script src="js/questions/nature-3.js"></script>
  <script src="js/questions/nature-4.js"></script>
  <script src="js/questions/food-1.js"></script>
  <script src="js/questions/food-2.js"></script>
  <script src="js/questions/food-3.js"></script>
  <script src="js/questions/food-4.js"></script>
  <script src="js/questions/everyday-1.js"></script>
  <script src="js/questions/everyday-2.js"></script>
  <script src="js/questions/everyday-3.js"></script>
  <script src="js/questions/everyday-4.js"></script>
  <script src="js/questions/geography-1.js"></script>
  <script src="js/questions/geography-2.js"></script>
  <script src="js/questions/geography-3.js"></script>
  <script src="js/questions/geography-4.js"></script>
  <script src="js/match.js"></script>
  <script src="js/config.js"></script>
  <script src="js/net.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
